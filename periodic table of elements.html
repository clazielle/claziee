<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table Animation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: auto;
}

.buttons {
    text-align: center;
    padding: 25px;
}

button {
    padding: 10px 18px;
    margin: 4px;
    border: 1px solid #292929;
    border-radius: 4px;
    background: #151515;
    color: #aaa;
    cursor: pointer;
    font-size: 14px;
}

button:hover,
button.active {
    background: white;
    color: black;
    box-shadow: 0 0 12px white;
}

#periodic-table {
    position: relative;
    width: 1250px;
    height: 950px;
    margin: 0 auto;
}

.element {
    position: absolute;
    width: 62px;
    height: 62px;
    background: #101020;
    border: 1px solid #00e5ff;
    border-radius: 5px;
    color: #00e5ff;
    text-align: center;

    transition:
        left 1s ease,
        top 1s ease,
        transform 1s ease,
        box-shadow 0.3s ease;

    cursor: pointer;
}

.element:hover {
    transform: scale(1.15);
    z-index: 100;
    box-shadow: 0 0 15px currentColor;
}

.number {
    font-size: 9px;
    color: #cccccc;
    position: absolute;
    top: 3px;
    right: 5px;
}

.symbol {
    font-size: 20px;
    font-weight: bold;
    margin-top: 15px;
}

.name {
    font-size: 7px;
    margin-top: 3px;
}

/* Alkali metals - Neon red */
.alkali {
    background: #260b16;
    border-color: #ff1744;
    color: #ff1744;
}
.alkali .name { color: #ff718c; }

/* Alkaline earth metals - Neon orange */
.alkaline {
    background: #291407;
    border-color: #ff9100;
    color: #ff9100;
}
.alkaline .name { color: #ffbd66; }

/* Transition metals - Neon blue */
.transition-metal {
    background: #08182e;
    border-color: #2979ff;
    color: #448aff;
}
.transition-metal .name { color: #82b1ff; }

/* Post-transition metals - Neon cyan */
.post-transition {
    background: #062322;
    border-color: #00e5ff;
    color: #00e5ff;
}
.post-transition .name { color: #80f5ff; }

/* Metalloids - Neon green */
.metalloid {
    background: #102408;
    border-color: #76ff03;
    color: #76ff03;
}
.metalloid .name { color: #b2ff59; }

/* Other nonmetals - Neon green */
.nonmetal {
    background: #082419;
    border-color: #00ff85;
    color: #00ff85;
}
.nonmetal .name { color: #7dffb5; }

/* Halogens - Neon pink */
.halogen {
    background: #290923;
    border-color: #ff2bd6;
    color: #ff2bd6;
}
.halogen .name { color: #ff8bea; }

/* Noble gases - Neon yellow */
.noble-gas {
    background: #292407;
    border-color: #ffee00;
    color: #ffee00;
}
.noble-gas .name { color: #fff68a; }

/* Lanthanides - Neon purple */
.lanthanide {
    background: #1b0c2e;
    border-color: #c040ff;
    color: #c040ff;
}
.lanthanide .name { color: #dfa0ff; }

/* Actinides - Neon magenta */
.actinide {
    background: #2b0a18;
    border-color: #ff4081;
    color: #ff4081;
}
.actinide .name { color: #ff9fbe; }

/* Color legend */
.legend {
    width: 100%;
    max-width: 1100px;
    margin: 10px auto 25px;
    padding: 0 15px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #ddd;
}

.legend-color {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    box-shadow: 0 0 6px currentColor;
}
</style>
</head>

<body>

<div class="buttons">
    <button class="active" onclick="changeLayout('table', this)">
        table
    </button>

    <button onclick="changeLayout('sphere', this)">
        sphere
    </button>

    <button onclick="changeLayout('helix', this)">
        helix
    </button>

    <button onclick="changeLayout('grid', this)">
        grid
    </button>
</div>

<div class="legend">
    <div class="legend-item">
        <span class="legend-color" style="background:#ff1744;color:#ff1744"></span>
        Alkali metals
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background:#ff9100;color:#ff9100"></span>
        Alkaline earth metals
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background:#448aff;color:#448aff"></span>
        Transition metals
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background:#00e5ff;color:#00e5ff"></span>
        Post-transition metals
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background:#76ff03;color:#76ff03"></span>
        Metalloids
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background:#00ff85;color:#00ff85"></span>
        Other nonmetals
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background:#ff2bd6;color:#ff2bd6"></span>
        Halogens
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background:#ffee00;color:#ffee00"></span>
        Noble gases
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background:#c040ff;color:#c040ff"></span>
        Lanthanides
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background:#ff4081;color:#ff4081"></span>
        Actinides
    </div>
</div>

<div id="periodic-table"></div>

<script>

/* =========================
   118 ELEMENTS
========================= */

const elements = [
["H","Hydrogen",1],
["He","Helium",2],
["Li","Lithium",3],
["Be","Beryllium",4],
["B","Boron",5],
["C","Carbon",6],
["N","Nitrogen",7],
["O","Oxygen",8],
["F","Fluorine",9],
["Ne","Neon",10],

["Na","Sodium",11],
["Mg","Magnesium",12],
["Al","Aluminium",13],
["Si","Silicon",14],
["P","Phosphorus",15],
["S","Sulfur",16],
["Cl","Chlorine",17],
["Ar","Argon",18],

["K","Potassium",19],
["Ca","Calcium",20],
["Sc","Scandium",21],
["Ti","Titanium",22],
["V","Vanadium",23],
["Cr","Chromium",24],
["Mn","Manganese",25],
["Fe","Iron",26],
["Co","Cobalt",27],
["Ni","Nickel",28],
["Cu","Copper",29],
["Zn","Zinc",30],
["Ga","Gallium",31],
["Ge","Germanium",32],
["As","Arsenic",33],
["Se","Selenium",34],
["Br","Bromine",35],
["Kr","Krypton",36],

["Rb","Rubidium",37],
["Sr","Strontium",38],
["Y","Yttrium",39],
["Zr","Zirconium",40],
["Nb","Niobium",41],
["Mo","Molybdenum",42],
["Tc","Technetium",43],
["Ru","Ruthenium",44],
["Rh","Rhodium",45],
["Pd","Palladium",46],
["Ag","Silver",47],
["Cd","Cadmium",48],
["In","Indium",49],
["Sn","Tin",50],
["Sb","Antimony",51],
["Te","Tellurium",52],
["I","Iodine",53],
["Xe","Xenon",54],

["Cs","Cesium",55],
["Ba","Barium",56],
["La","Lanthanum",57],
["Ce","Cerium",58],
["Pr","Praseodymium",59],
["Nd","Neodymium",60],
["Pm","Promethium",61],
["Sm","Samarium",62],
["Eu","Europium",63],
["Gd","Gadolinium",64],
["Tb","Terbium",65],
["Dy","Dysprosium",66],
["Ho","Holmium",67],
["Er","Erbium",68],
["Tm","Thulium",69],
["Yb","Ytterbium",70],
["Lu","Lutetium",71],

["Hf","Hafnium",72],
["Ta","Tantalum",73],
["W","Tungsten",74],
["Re","Rhenium",75],
["Os","Osmium",76],
["Ir","Iridium",77],
["Pt","Platinum",78],
["Au","Gold",79],
["Hg","Mercury",80],
["Tl","Thallium",81],
["Pb","Lead",82],
["Bi","Bismuth",83],
["Po","Polonium",84],
["At","Astatine",85],
["Rn","Radon",86],

["Fr","Francium",87],
["Ra","Radium",88],
["Ac","Actinium",89],
["Th","Thorium",90],
["Pa","Protactinium",91],
["U","Uranium",92],
["Np","Neptunium",93],
["Pu","Plutonium",94],
["Am","Americium",95],
["Cm","Curium",96],
["Bk","Berkelium",97],
["Cf","Californium",98],
["Es","Einsteinium",99],
["Fm","Fermium",100],
["Md","Mendelevium",101],
["No","Nobelium",102],
["Lr","Lawrencium",103],

["Rf","Rutherfordium",104],
["Db","Dubnium",105],
["Sg","Seaborgium",106],
["Bh","Bohrium",107],
["Hs","Hassium",108],
["Mt","Meitnerium",109],
["Ds","Darmstadtium",110],
["Rg","Roentgenium",111],
["Cn","Copernicium",112],
["Nh","Nihonium",113],
["Fl","Flerovium",114],
["Mc","Moscovium",115],
["Lv","Livermorium",116],
["Ts","Tennessine",117],
["Og","Oganesson",118]
];


/* =========================
   ELEMENT CLASSIFICATION
========================= */

const alkali = ["Li","Na","K","Rb","Cs","Fr"];

const alkaline = ["Be","Mg","Ca","Sr","Ba","Ra"];

const metalloids = [
    "B","Si","Ge","As","Sb","Te"
];

const nonmetals = [
    "H","C","N","O","P","S","Se"
];

const halogens = [
    "F","Cl","Br","I","At","Ts"
];

const nobleGases = [
    "He","Ne","Ar","Kr","Xe","Rn","Og"
];

const postTransition = [
    "Al","Ga","In","Sn","Tl","Pb","Bi",
    "Po","Nh","Fl","Mc","Lv"
];

const lanthanides = [
    "La","Ce","Pr","Nd","Pm","Sm","Eu","Gd",
    "Tb","Dy","Ho","Er","Tm","Yb","Lu"
];

const actinides = [
    "Ac","Th","Pa","U","Np","Pu","Am","Cm",
    "Bk","Cf","Es","Fm","Md","No","Lr"
];

const transitionMetals = [
    "Sc","Ti","V","Cr","Mn","Fe","Co","Ni",
    "Cu","Zn","Y","Zr","Nb","Mo","Tc","Ru",
    "Rh","Pd","Ag","Cd","Hf","Ta","W","Re",
    "Os","Ir","Pt","Au","Hg","Rf","Db","Sg",
    "Bh","Hs","Mt","Ds","Rg","Cn"
];

function classifyElement(symbol) {
    if (alkali.includes(symbol)) return "alkali";
    if (alkaline.includes(symbol)) return "alkaline";
    if (lanthanides.includes(symbol)) return "lanthanide";
    if (actinides.includes(symbol)) return "actinide";
    if (nobleGases.includes(symbol)) return "noble-gas";
    if (halogens.includes(symbol)) return "halogen";
    if (metalloids.includes(symbol)) return "metalloid";
    if (nonmetals.includes(symbol)) return "nonmetal";
    if (postTransition.includes(symbol)) return "post-transition";
    if (transitionMetals.includes(symbol)) return "transition-metal";

    return "post-transition";
}


/* =========================
   CREATE ELEMENTS
========================= */

const container =
    document.getElementById("periodic-table");

elements.forEach((element) => {

    const box = document.createElement("div");

    box.className =
        "element " + classifyElement(element[0]);

    box.innerHTML = `
        <div class="number">${element[2]}</div>
        <div class="symbol">${element[0]}</div>
        <div class="name">${element[1]}</div>
    `;

    container.appendChild(box);
});

const boxes =
    document.querySelectorAll(".element");


/* =========================
   PERIODIC TABLE POSITIONS
========================= */

const positions = [];

/* Period 1 */
positions.push([1,1]);   // H
positions.push([18,1]);  // He

/* Period 2 */
positions.push([1,2]);
positions.push([2,2]);

for(let col = 13; col <= 18; col++) {
    positions.push([col,2]);
}

/* Period 3 */
positions.push([1,3]);
positions.push([2,3]);

for(let col = 13; col <= 18; col++) {
    positions.push([col,3]);
}

/* Period 4 */
for(let col = 1; col <= 18; col++) {
    positions.push([col,4]);
}

/* Period 5 */
for(let col = 1; col <= 18; col++) {
    positions.push([col,5]);
}

/* Period 6 */
positions.push([1,6]);
positions.push([2,6]);

for(let col = 4; col <= 18; col++) {
    positions.push([col,6]);
}

/* Period 7 */
positions.push([1,7]);
positions.push([2,7]);

for(let col = 4; col <= 18; col++) {
    positions.push([col,7]);
}

/* Lanthanides */
for(let col = 4; col <= 18; col++) {
    positions.push([col,8]);
}

/* Actinides */
for(let col = 4; col <= 18; col++) {
    positions.push([col,9]);
}


/* =========================
   TABLE LAYOUT
========================= */

function tableLayout() {
    boxes.forEach((box, i) => {
        const [col, row] = positions[i];

        box.style.left =
            ((col - 1) * 66) + "px";

        box.style.top =
            ((row - 1) * 70) + "px";
    });
}


/* =========================
   GRID LAYOUT
========================= */

function gridLayout() {
    boxes.forEach((box, i) => {
        const col = i % 15;
        const row = Math.floor(i / 15);

        box.style.left =
            (col * 75 + 80) + "px";

        box.style.top =
            (row * 70 + 30) + "px";
    });
}


/* =========================
   SPHERE LAYOUT
========================= */

function sphereLayout() {
    boxes.forEach((box, i) => {
        const angle =
            (i / boxes.length) * Math.PI * 2;

        const x =
            580 + Math.cos(angle) * 250;

        const y =
            350 + Math.sin(angle) * 190;

        box.style.left = x + "px";
        box.style.top = y + "px";
    });
}


/* =========================
   HELIX
========================= */

function helixLayout() {

    boxes.forEach((box, i) => {

        const angle = i * 0.35;

        const radius = 220;

        const x =
            580 +
            Math.cos(angle) * radius;

        const y =
            50 +
            i * 5 +
            Math.sin(angle) * 100;

        box.style.left = x + "px";
        box.style.top = y + "px";
    });
}
/* =========================
   HELIX
========================= */

function helixLayout() {

    boxes.forEach((box, i) => {

        const angle = i * 0.35;

        const radius = 220;

        const x =
            580 +
            Math.cos(angle) * radius;

        const y =
            50 +
            i * 5 +
            Math.sin(angle) * 100;

        box.style.left = x + "px";
        box.style.top = y + "px";
    });
}



/* =========================
   CHANGE LAYOUT
========================= */

function changeLayout(layout, button) {

    document
        .querySelectorAll("button")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");

    if(layout === "table") {
        tableLayout();
    }

    if(layout === "grid") {
        gridLayout();
    }

    if(layout === "sphere") {
        sphereLayout();
    }

    if(layout === "helix") {
        helixLayout();
    }
}


/* =========================
   START
========================= */

tableLayout();

</script>

</body>
</html>
